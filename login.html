<!DOCTYPE html>
<html lang="ru">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniqpost — Вход</title>
<style>
  :root {
    --bg:#07080c; --panel:#0c0f16; --panel-2:#10141d;
    --line:rgba(60,130,255,.16); --neon:#2f7bff; --neon-2:#58a6ff;
    --neon-soft:rgba(47,123,255,.14); --text:#e8ecf4; --muted:#7c8699;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:var(--font); background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.2rem;
    background-image:
      radial-gradient(900px 500px at 15% -10%, rgba(47,123,255,.14), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(47,123,255,.08), transparent 55%);
  }
  .auth {
    width:100%; max-width:400px; background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line); border-radius:20px; padding:2.2rem 1.8rem;
    box-shadow:0 40px 90px -40px rgba(47,123,255,.35);
  }
  .brand { display:flex; align-items:center; justify-content:center; gap:.55rem; font-weight:800; font-size:1.15rem; letter-spacing:-.02em; margin-bottom:.35rem; }
  .brand .dot { width:11px; height:11px; border-radius:50%; background:var(--neon); box-shadow:0 0 12px var(--neon),0 0 22px rgba(47,123,255,.6); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.65;transform:scale(.92)} 50%{opacity:1;transform:scale(1.08)} }
  .sub { text-align:center; color:var(--muted); font-size:.84rem; margin-bottom:1.7rem; }
  .field { margin-bottom:1rem; }
  .field label { display:block; font-size:.76rem; color:var(--muted); font-weight:600; margin-bottom:.4rem; }
  .field input {
    width:100%; padding:.72rem .85rem; border-radius:12px; font-family:var(--font); font-size:.9rem;
    background:rgba(255,255,255,.03); border:1px solid var(--line); color:var(--text); outline:none;
    transition:border-color .18s, box-shadow .18s;
  }
  .field input::placeholder { color:#5a6478; }
  .field input:focus { border-color:var(--neon); box-shadow:0 0 0 3px var(--neon-soft); }
  .btn {
    width:100%; border:none; border-radius:100px; padding:.8rem; font-family:var(--font);
    font-size:.9rem; font-weight:700; cursor:pointer; margin-top:.5rem; transition:all .18s;
    background:linear-gradient(135deg,#2f7bff,#0d4ea8); color:#fff;
    box-shadow:0 0 18px rgba(47,123,255,.45),0 6px 22px -8px rgba(47,123,255,.7);
  }
  .btn:hover { box-shadow:0 0 28px rgba(47,123,255,.7),0 8px 26px -8px rgba(47,123,255,.9); transform:translateY(-1px); }
  .btn:disabled { opacity:.6; cursor:wait; transform:none; }
  .msg { text-align:center; font-size:.82rem; margin-top:.9rem; min-height:1.1rem; }
  .msg.err { color:#ff6b6b; }
  .msg.ok { color:var(--text); }
  .back { text-align:center; margin-top:1.2rem; }
  .back a { color:var(--muted); font-size:.78rem; text-decoration:none; }
  .back a:hover { color:var(--neon-2); }
</style>
</head>
<body>
  <form class="auth" id="form">
    <div class="brand"><span class="dot"></span> Uniqpost</div>
    <div class="sub">Вход в личный кабинет</div>

    <div class="field">
      <label>Почта</label>
      <input type="email" id="email" placeholder="you@mail.ru" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button class="btn" type="submit" id="submitBtn" style="width:auto;padding:.8rem 1.6rem;display:block;margin:.5rem auto 0">Войти</button>
    <div class="msg" id="msg"></div>

    <div style="display:flex;align-items:center;gap:.8rem;margin:1rem 0 .6rem;color:var(--muted);font-size:.74rem">
      <span style="flex:1;height:1px;background:var(--line)"></span>или<span style="flex:1;height:1px;background:var(--line)"></span>
    </div>
    <button type="button" id="tgBtn" style="width:100%;border:none;border-radius:100px;padding:.8rem;font-family:var(--font);font-size:.9rem;font-weight:700;cursor:pointer;background:#229ED9;color:#fff;display:flex;align-items:center;justify-content:center;gap:.55rem;transition:filter .18s">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#fff" opacity=".18"/><path d="M5.6 11.8l10.1-4.2c.5-.2.9.1.8.7l-1.7 8c-.1.6-.5.7-1 .4l-2.6-1.9-1.3 1.2c-.2.2-.3.3-.6.3l.2-2.7 5-4.6c.2-.2 0-.3-.2-.1l-6.2 3.9-2.5-.8c-.6-.2-.6-.5.1-.7z" fill="#fff"/></svg>
      Войти через Telegram
    </button>
    <div class="back"><span style="color:var(--text);font-size:.78rem">Нет аккаунта?</span> <a href="#" id="toReg">Зарегистрироваться</a></div>
    <div class="back"><a href="index.html">← На главную</a></div>
  </form>

  <form class="auth" id="regForm" style="display:none">
    <div class="brand"><span class="dot"></span> Uniqpost</div>
    <div class="sub">Регистрация</div>

    <div class="field">
      <label>Имя</label>
      <input type="text" id="rName" placeholder="Как к вам обращаться" autocomplete="name" required>
    </div>
    <div class="field">
      <label>Почта</label>
      <input type="email" id="rEmail" placeholder="you@mail.ru" autocomplete="email" required>
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="rPass" placeholder="минимум 8 символов" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label>Повторите пароль</label>
      <input type="password" id="rPass2" placeholder="••••••••" autocomplete="new-password" required>
    </div>
    <label style="display:flex;gap:.5rem;align-items:flex-start;font-size:.78rem;color:var(--muted);margin:.2rem 0 .6rem;cursor:pointer">
      <input type="checkbox" id="rAgree" style="margin-top:.15rem">
      <span>Согласен с обработкой персональных данных и условиями сервиса</span>
    </label>

    <button class="btn" type="submit" id="regBtn" style="width:auto;padding:.8rem 1.6rem;display:block;margin:.5rem auto 0">Зарегистрироваться</button>
    <div class="msg" id="regMsg"></div>
    <div class="back"><span style="color:var(--text);font-size:.78rem">Уже есть аккаунт?</span> <a href="#" id="toLogin">Войти</a></div>
  </form>

<script>
  // Адрес API (публичный HTTPS через Tailscale Funnel)
  const API_URL = '/api';
  const DEMO = false;
  const DEMO_EMAIL = 'yulia9500@mail.ru';
  const DEMO_PASS = 'Test123!!!';
  const TG_BOT = 'reunique_bot';

  // ── Вход через Telegram (одной кнопкой) ──
  function finishTgLogin(data) {
    localStorage.setItem('uniqpost_token', data.token);
    localStorage.setItem('uniqpost_email', data.email);
    if (data.name) localStorage.setItem('uniqpost_name', data.name);
    msg.className = 'msg'; msg.style.color = 'var(--text)'; msg.textContent = 'Вход выполнен. Открываю кабинет…';
    setTimeout(() => { location.href = 'dashboard.html'; }, 600);
  }

  async function tgLogin(initData) {
    const r = await fetch(API_URL + '/telegram-auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData })
    });
    const d = await r.json();
    if (r.ok && d.ok) finishTgLogin(d);
    else { msg.className = 'msg err'; msg.textContent = d.error || 'Не удалось войти через Telegram'; }
  }

  document.getElementById('tgBtn').addEventListener('click', async () => {
    const tg = window.Telegram && window.Telegram.WebApp;
    // Внутри Telegram — тихий вход по initData
    if (tg && tg.initData) { tgLogin(tg.initData); return; }

    // В браузере — Способ 1: получаем код, отправляем человека в бота, ждём подтверждения
    try {
      btn.disabled = true;
      const r = await fetch(API_URL + '/tg-login/start', { method: 'POST' });
      const d = await r.json();
      if (!r.ok || !d.ok) { msg.className = 'msg err'; msg.textContent = 'Не удалось начать вход'; btn.disabled = false; return; }
      localStorage.setItem('uniqpost_tg_code', d.code);
      window.open('https://t.me/' + (d.bot || TG_BOT) + '?start=login_' + d.code, '_blank');
      msg.className = 'msg'; msg.style.color = 'var(--muted)';
      msg.textContent = 'Открыли Telegram — нажмите «Старт» в боте. Ждём подтверждение…';
      // опрашиваем статус раз в 2 сек до 10 минут
      let tries = 0;
      const poll = setInterval(async () => {
        tries++;
        try {
          const s = await fetch(API_URL + '/tg-login/status?code=' + encodeURIComponent(d.code));
          const sd = await s.json();
          if (sd.status === 'confirmed') { clearInterval(poll); finishTgLogin(sd); }
          else if (sd.status === 'expired' || tries > 300) { clearInterval(poll); msg.className='msg err'; msg.textContent='Время входа истекло. Попробуйте снова.'; btn.disabled=false; }
        } catch {}
      }, 2000);
    } catch (e) { msg.className='msg err'; msg.textContent='Нет связи с сервером'; btn.disabled=false; }
  });

  // Автовход, если открыто внутри Telegram
  (function() {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.initData) { tg.ready(); tgLogin(tg.initData); }
  })();

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg'; msg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    btn.disabled = true;

    // Демо-режим: проверяем локально (временно, до подключения домена/API)
    if (DEMO) {
      setTimeout(() => {
        if (email.toLowerCase() === DEMO_EMAIL && password === DEMO_PASS) {
          msg.className = 'msg'; msg.style.color = 'var(--text)'; msg.textContent = 'Вход выполнен. Открываю кабинет…';
          localStorage.setItem('uniqpost_demo_auth', '1');
          setTimeout(() => { location.href = 'dashboard.html'; }, 700);
        } else {
          msg.className = 'msg err'; msg.textContent = 'Неверная почта или пароль';
          btn.disabled = false;
        }
      }, 500);
      return;
    }

    // Реальный режим через API
    try {
      const r = await fetch(API_URL + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await r.json();
      if (r.ok && data.ok) {
        localStorage.setItem('uniqpost_token', data.token);
        localStorage.setItem('uniqpost_email', email);
        msg.className = 'msg'; msg.style.color = 'var(--text)'; msg.textContent = 'Вход выполнен. Открываю кабинет…';
        setTimeout(() => { location.href = 'dashboard.html'; }, 600);
      } else {
        msg.className = 'msg err'; msg.textContent = data.error || 'Ошибка входа';
        btn.disabled = false;
      }
    } catch (err) {
      msg.className = 'msg err'; msg.textContent = 'Нет связи с сервером';
      btn.disabled = false;
    }
  });

  // ── Переключение вход ↔ регистрация ──
  const regForm = document.getElementById('regForm');
  document.getElementById('toReg').onclick = (e) => { e.preventDefault(); form.style.display='none'; regForm.style.display='block'; document.getElementById('regMsg').textContent=''; };
  document.getElementById('toLogin').onclick = (e) => { e.preventDefault(); regForm.style.display='none'; form.style.display='block'; msg.textContent=''; };

  regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const rmsg = document.getElementById('regMsg');
    const rbtn = document.getElementById('regBtn');
    rmsg.className='msg'; rmsg.textContent='';
    const name = document.getElementById('rName').value.trim();
    const email = document.getElementById('rEmail').value.trim();
    const p1 = document.getElementById('rPass').value;
    const p2 = document.getElementById('rPass2').value;
    const agree = document.getElementById('rAgree').checked;
    if (!name) { rmsg.className='msg err'; rmsg.textContent='Укажите имя'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { rmsg.className='msg err'; rmsg.textContent='Некорректная почта'; return; }
    if (p1.length < 8) { rmsg.className='msg err'; rmsg.textContent='Пароль минимум 8 символов'; return; }
    if (p1 !== p2) { rmsg.className='msg err'; rmsg.textContent='Пароли не совпадают'; return; }
    if (!agree) { rmsg.className='msg err'; rmsg.textContent='Нужно согласие с обработкой данных'; return; }
    rbtn.disabled = true;
    try {
      const r = await fetch(API_URL + '/register', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password: p1, name }) });
      const d = await r.json();
      if (r.ok && d.ok) {
        rmsg.className='msg'; rmsg.style.color='var(--text)';
        rmsg.textContent = d.sent ? 'Готово! Проверьте почту и подтвердите регистрацию.' : 'Аккаунт создан, но письмо не отправилось. Обратитесь в поддержку.';
      } else {
        rmsg.className='msg err'; rmsg.textContent = d.error || 'Ошибка регистрации';
        rbtn.disabled = false;
      }
    } catch (err) {
      rmsg.className='msg err'; rmsg.textContent='Нет связи с сервером'; rbtn.disabled = false;
    }
  });
</script>
</body>
</html>
