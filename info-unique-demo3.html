<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uniqpost — Уникализация 3D (превью 3)</title>
<style>
  :root{
    --bg:#07080c; --line:rgba(60,130,255,.16); --neon:#2f7bff; --neon-2:#58a6ff;
    --neon-soft:rgba(47,123,255,.14); --text:#e8ecf4; --muted:#7c8699;
    --ok:#4fd08a; --bad:#ff6b6b;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
    background-image:
      radial-gradient(900px 500px at 15% -10%, rgba(47,123,255,.14), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(47,123,255,.08), transparent 55%);}
  .wrap{max-width:900px;margin:0 auto;padding:2.2rem 1.2rem 3rem}

  .nav{display:flex;align-items:center;gap:.6rem;margin-bottom:1.4rem}
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--neon);
    box-shadow:0 0 12px var(--neon),0 0 22px rgba(47,123,255,.6);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}

  .sec{display:flex;align-items:center;gap:1rem;text-transform:uppercase;font-size:.72rem;
    letter-spacing:.16em;color:var(--muted);margin:0 0 .9rem}
  .sec:before,.sec:after{content:"";flex:1;height:1px;background:var(--line)}
  .sec b{color:var(--text)}

  /* 3D-сцена */
  .stage{position:relative;width:100%;height:420px;border:1px solid var(--line);border-radius:22px;
    overflow:hidden;background:
      radial-gradient(600px 300px at 50% 10%, rgba(47,123,255,.14), transparent 65%),
      linear-gradient(180deg, #0a0e16, #070a10);
    box-shadow:0 -1px 0 rgba(255,255,255,.03) inset, 0 40px 90px -50px rgba(0,0,0,.95)}
  .stage canvas{display:block;width:100%;height:100%}
  .stage .hintmini{position:absolute;right:.9rem;bottom:.7rem;font-size:.66rem;color:var(--muted);opacity:.7}

  .lead{color:var(--muted);font-size:.92rem;line-height:1.6;text-align:center;margin:1.4rem auto 0;max-width:600px}
  .lead b{color:var(--text)}

  .total{margin-top:1.6rem;text-align:center;padding:1.2rem 1.4rem;border-radius:18px;
    border:1px solid rgba(47,123,255,.5);
    background:linear-gradient(160deg, rgba(47,123,255,.12), rgba(10,14,21,.96));
    box-shadow:0 28px 60px -34px rgba(47,123,255,.7)}
  .total .big{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
  .total .big em{font-style:normal;color:var(--neon-2)}

  @media (max-width:560px){ .stage{height:340px} .total .big{font-size:1.1rem} }
</style>
</head>
<body>
<div class="wrap">

  <div class="nav"><div class="brand"><span class="dot"></span> Uniqpost</div></div>

  <div class="sec"><span>ЗАЧЕМ НУЖНА <b>УНИКАЛИЗАЦИЯ</b></span></div>

  <div class="stage" id="stage">
    <div class="hintmini">покрутите сцену пальцем</div>
  </div>

  <div class="lead">
    Один ролик публикуется снова и снова — и каждый раз для соцсети это <b>новое видео</b>. Крутите сцену: слева — оригинал, вокруг — его уникализированные версии, каждая возвращает охват.
  </div>

  <div class="total">
    <div class="big">Один ролик → <em>до 5 версий</em> → охват заново</div>
  </div>

</div>

<script type="importmap">
{ "imports": { "three": "/libs/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/libs/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, stage.clientWidth/stage.clientHeight, 0.1, 100);
camera.position.set(0, 1.1, 8.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enableZoom = false;
controls.minPolarAngle = Math.PI*0.32;
controls.maxPolarAngle = Math.PI*0.62;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;

// свет
scene.add(new THREE.AmbientLight(0x8fb8ff, 1.1));
const key = new THREE.DirectionalLight(0x2f7bff, 1.6); key.position.set(4,6,5); scene.add(key);
const rim = new THREE.DirectionalLight(0x58a6ff, 1.0); rim.position.set(-5,2,-4); scene.add(rim);

// текстура «кадра видео»
function makeThumb(label, accent, views){
  const c = document.createElement('canvas'); c.width = 192; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,192,256);
  grd.addColorStop(0, '#101826'); grd.addColorStop(1, '#0a0e16');
  g.fillStyle = grd; g.fillRect(0,0,192,256);
  // блик
  g.strokeStyle = accent; g.lineWidth = 3; g.globalAlpha = .9;
  g.strokeRect(6,6,180,244); g.globalAlpha = 1;
  // «плей»
  g.beginPath(); g.arc(96,120,26,0,Math.PI*2); g.fillStyle = accent; g.globalAlpha=.22; g.fill(); g.globalAlpha=1;
  g.beginPath(); g.moveTo(88,108); g.lineTo(112,120); g.lineTo(88,132); g.closePath(); g.fillStyle = accent; g.fill();
  // подписи
  g.fillStyle = '#e8ecf4'; g.font = 'bold 20px Inter,Arial'; g.textAlign='center';
  g.fillText(label, 96, 44);
  g.fillStyle = accent; g.font = 'bold 26px Inter,Arial';
  g.fillText(views, 96, 205);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}

// оригинал в центре
const centerMat = new THREE.MeshStandardMaterial({
  map: makeThumb('ОРИГИНАЛ', '#8f9bb3', '200'),
  color: 0xffffff, roughness:.55, metalness:.15,
});
const center = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.1, 0.12), centerMat);
center.position.set(0, 0, 0);
scene.add(center);
center.add(new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.03, 0.14),
  new THREE.MeshBasicMaterial({color:0x58a6ff}))).position.set(0,1.06,0);

// версии по кругу
const VERSIONS = [
  { label:'ВЕРСИЯ', views:'+500', color:'#4fd08a', angle: 0.0 },
  { label:'ВЕРСИЯ', views:'+500', color:'#4fd08a', angle: Math.PI*0.5 },
  { label:'ВЕРСИЯ', views:'+480', color:'#4fd08a', angle: Math.PI },
  { label:'ВЕРСИЯ', views:'+520', color:'#4fd08a', angle: Math.PI*1.5 },
];
const R = 3.4;
const items = [];
VERSIONS.forEach((v,i)=>{
  const mat = new THREE.MeshStandardMaterial({
    map: makeThumb(v.label, v.color, v.views), color:0xffffff, roughness:.5, metalness:.2,
    transparent:true, opacity:.96,
  });
  const m = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.5, 0.1), mat);
  const x = Math.sin(v.angle)*R, z = Math.cos(v.angle)*R;
  m.position.set(x, 0, z);
  m.lookAt(0,0,0);
  scene.add(m);
  items.push({ mesh:m, base:m.position.clone(), phase: i*1.2 });
});

// «звёзды»-частицы
const pg = new THREE.BufferGeometry();
const pts = [];
for (let i=0;i<160;i++){
  const a = Math.random()*Math.PI*2, r = 4.5 + Math.random()*6, y = (Math.random()-0.5)*6;
  pts.push(Math.sin(a)*r, y, Math.cos(a)*r);
}
pg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color:0x2f7bff, size:0.05, transparent:true, opacity:.55 })));

// кольцо-орбита
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(R, 0.008, 8, 128),
  new THREE.MeshBasicMaterial({ color:0x2f7bff, transparent:true, opacity:.35 })
);
ring.rotation.x = Math.PI/2; scene.add(ring);

const clock = new THREE.Clock();
function loop(){
  const t = clock.getElapsedTime();
  center.rotation.y = Math.sin(t*0.6)*0.18;
  center.position.y = Math.sin(t*1.1)*0.08;
  items.forEach((it,i)=>{
    it.mesh.position.y = Math.sin(t*1.1 + it.phase)*0.12;
    const s = 1 + Math.sin(t*2 + it.phase)*0.02;
    it.mesh.scale.setScalar(s);
  });
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', ()=>{
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
