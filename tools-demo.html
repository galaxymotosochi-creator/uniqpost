<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Uniqpost — Инструменты (пример) v3</title>
<style>
  :root{
    --bg:#070a11; --line:rgba(60,130,255,.16);
    --text:#e8ecf4; --muted:#7c8699; --neon:#2f7bff; --neon-2:#5b9cff; --neon-soft:rgba(47,123,255,.1);
    --font:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:3rem 1.2rem 5rem}

  .demo-title{text-align:center;font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);
    display:flex;align-items:center;gap:1rem;margin-bottom:2.4rem}
  .demo-title:before,.demo-title:after{content:"";flex:1;height:1px;background:var(--line)}
  .demo-title b{color:var(--text)}

  /* ── карточка «Инструменты» ── */
  .tool{
    position:relative; border:1px solid var(--line); border-radius:24px; overflow:hidden;
    background:linear-gradient(160deg, rgba(20,26,38,.96), rgba(10,14,21,.96));
    box-shadow:0 -1px 0 rgba(255,255,255,.03) inset, 0 40px 80px -50px rgba(0,0,0,.95);
    padding:2.6rem 2.6rem 2.2rem;
  }
  /* декоративные линии на фоне */
  .tool .lines{position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(120% 90% at 85% 0%, rgba(47,123,255,.16), transparent 60%),
      repeating-linear-gradient(90deg, transparent 0 78px, rgba(60,130,255,.055) 78px 79px);
    -webkit-mask-image:linear-gradient(180deg, #000, transparent 85%);
            mask-image:linear-gradient(180deg, #000, transparent 85%);}
  .tool > *{position:relative}

  .tool h3{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.65rem}
  .tool p{color:var(--muted);font-size:.96rem;line-height:1.62;max-width:52ch}

  /* хаотичный разброс логотипов */
  .tool .logos{position:relative;height:260px;margin:1.4rem 0 1.6rem}
  .tool .logos .lg{position:absolute;display:grid;place-items:center;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.55));
    animation:floaty 4.5s ease-in-out infinite}
  .tool .logos .lg svg{width:100%;height:100%}
  .tool .logos .lg:nth-child(1){width:88px;height:88px;left:4%;top:12%;animation-delay:0s;transform:rotate(-8deg)}
  .tool .logos .lg:nth-child(2){width:108px;height:108px;left:23%;top:44%;animation-delay:.6s;transform:rotate(6deg)}
  .tool .logos .lg:nth-child(3){width:72px;height:72px;left:42%;top:8%;animation-delay:1.2s;transform:rotate(-4deg)}
  .tool .logos .lg:nth-child(4){width:86px;height:86px;left:58%;top:40%;animation-delay:.3s;transform:rotate(9deg)}
  .tool .logos .lg:nth-child(5){width:62px;height:62px;left:78%;top:14%;animation-delay:1.5s;transform:rotate(-7deg)}
  .tool .logos .lg:nth-child(6){width:96px;height:96px;left:12%;top:66%;animation-delay:.9s;transform:rotate(5deg)}
  .tool .logos .lg:nth-child(7){width:80px;height:80px;left:70%;top:70%;animation-delay:1.1s;transform:rotate(-6deg)}
  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -8px}}

  .tool .btn-more{display:inline-flex;align-items:center;gap:.5rem;
    padding:.6rem 1.15rem;border-radius:100px;border:1px solid rgba(47,123,255,.5);
    color:var(--text);font-size:.82rem;font-weight:600;text-decoration:none;
    background:rgba(47,123,255,.06);transition:background .25s, transform .25s}
  .tool .btn-more:hover{background:rgba(47,123,255,.16);transform:translateX(2px)}
  .tool .btn-more .ar{color:var(--neon-2);font-weight:700}

  @media (max-width:640px){
    .tool{padding:1.6rem 1.3rem 1.4rem;border-radius:20px}
    .tool h3{font-size:1.25rem}
    .tool p{font-size:.88rem}
    .tool .logos{height:210px}
    /* логотипы на телефоне — крупные и в тех же позициях */
    .tool .logos .lg:nth-child(1){width:66px;height:66px}
    .tool .logos .lg:nth-child(2){width:104px;height:104px}
    .tool .logos .lg:nth-child(3){width:58px;height:58px}
    .tool .logos .lg:nth-child(4){width:76px;height:76px}
    .tool .logos .lg:nth-child(5){width:54px;height:54px}
    .tool .logos .lg:nth-child(6){width:92px;height:92px}
    .tool .logos .lg:nth-child(7){width:68px;height:68px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="demo-title">ИНСТРУМЕНТЫ ДЛЯ РАЗНЫХ ЗАДАЧ — <b>ПРИМЕР</b></div>

  <div class="tool">
    <div class="lines"></div>

    <h3>Публикации</h3>
    <p>Публикуйте посты, фото и видео по расписанию сразу во все соцсети — загружаете один раз, система сама разложит по площадкам в нужное время.</p>

    <div class="logos">
      <span class="lg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path d="M5.5 11.8l10.2-4.3c.5-.2.9.1.8.7l-1.7 8.1c-.1.6-.5.7-1 .4l-2.7-2-1.3 1.3c-.2.2-.3.3-.6.3l.2-2.8 5.2-4.7c.2-.2 0-.3-.3-.1l-6.4 4-2.6-.8c-.6-.2-.6-.6.2-.8z" fill="#fff"/></svg></span>
      <span class="lg"><svg viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="none" stroke="#E1306C" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#E1306C" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.4" fill="#E1306C"/></svg></span>
      <span class="lg"><svg viewBox="0 0 24 24"><rect x="1.5" y="4" width="21" height="16" rx="4.5" fill="#FF0000"/><path d="M10 8.8l5.5 3.2L10 15.2V8.8z" fill="#fff"/></svg></span>
      <span class="lg"><svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#0077FF"/><path d="M12.9 16.2c-4.1 0-6.6-2.9-6.7-7.6h2c.1 3.5 1.7 5 2.9 5.3V8.6h1.9v2.8c1.2-.1 2.4-1.4 2.8-2.8h1.9c-.3 1.7-1.5 3-2.4 3.5 1 .4 2.3 1.6 2.8 3.5h-2.1c-.4-1.3-1.5-2.3-2.8-2.4v2.4h-.3z" fill="#fff"/></svg></span>
      <span class="lg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#EE8208"/><circle cx="12" cy="10.2" r="3.2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M8.4 15.2c1 .9 2.2 1.4 3.6 1.4s2.6-.5 3.6-1.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span class="lg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path d="M15.5 12.6h-2.2V19h-2.7v-6.4H9v-2.3h1.6V8.9c0-1.7 1-2.9 2.8-2.9.8 0 1.5.1 1.7.1v2h-1.2c-.9 0-1.1.5-1.1 1.1v1.1h2.3l-.6 2.3z" fill="#fff"/></svg></span>
      <span class="lg"><svg viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#000"/><path d="M14.2 6.5c.3 1.7 1.5 2.9 3.2 3.1v2c-1.2.1-2.3-.2-3.3-.9v4.3c0 2.3-1.7 4-4 4-2 0-3.6-1.4-3.9-3.3-.3-2.2 1.4-4.2 3.7-4.2.3 0 .6 0 .9.1v2.1c-.3-.1-.6-.2-.9-.2-1.1 0-1.9.9-1.8 2 .1 1 .9 1.7 1.9 1.7 1.1 0 2-.9 2-2V6.5h2.2z" fill="#25F4EE"/></svg></span>
    </div>

    <a class="btn-more" href="#">Подробнее <span class="ar">→</span></a>
  </div>
</div>
</body>
</html>
