<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uniqpost — 3D-студия</title>
<style>
  :root{--bg:#05060a;--neon:#2f7bff;--neon2:#58a6ff;--text:#eaf0ff;--muted:#8b9ac0;
    --panel:rgba(8,11,18,.8);--line:rgba(70,130,255,.2);--font:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
  #app{position:fixed;inset:0}
  .hud{position:fixed;top:0;left:0;right:0;padding:.9rem 1.1rem;display:flex;justify-content:space-between;
    align-items:flex-start;gap:1rem;pointer-events:none;z-index:10;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.6rem;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:.5rem .85rem;backdrop-filter:blur(10px);pointer-events:auto}
  .brand span{width:25px;height:25px;border-radius:8px;background:linear-gradient(135deg,var(--neon),var(--neon2));
    display:grid;place-items:center;font-size:.85rem}
  .brand b{font-size:.84rem}.brand small{color:var(--muted);font-weight:500;font-size:.7rem}
  .stats{display:flex;gap:.45rem;flex-wrap:wrap;pointer-events:auto}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:.45rem .75rem;
    backdrop-filter:blur(10px);font-size:.74rem;display:flex;gap:.35rem;align-items:center}
  .stat b{color:var(--neon2)}
  .panel{position:fixed;right:1.1rem;bottom:1.1rem;width:min(255px,76vw);background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:.85rem;backdrop-filter:blur(12px);z-index:10}
  .panel h3{font-size:.7rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:.5rem;
    display:flex;align-items:center;gap:.45rem}
  .panel h3::before{content:'';width:2px;height:12px;background:var(--neon);border-radius:2px}
  .net{display:flex;align-items:center;gap:.5rem;padding:.38rem .5rem;border-radius:9px;
    background:rgba(255,255,255,.03);font-size:.76rem;margin-bottom:.32rem}
  .net .ic{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:.62rem;font-weight:800;color:#fff}
  .net .st{margin-left:auto;color:var(--muted);font-size:.66rem}
  .btn{background:linear-gradient(135deg,var(--neon),var(--neon2));border:none;color:#fff;font-family:var(--font);
    font-weight:700;padding:.58rem .85rem;border-radius:11px;cursor:pointer;font-size:.76rem;width:100%;margin-top:.5rem}
  .btn:active{transform:translateY(1px)}
  .cap{position:fixed;left:1.1rem;bottom:1.1rem;max-width:min(350px,60vw);background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:.55rem .85rem;font-size:.73rem;color:var(--muted);
    backdrop-filter:blur(10px);z-index:10}
  .cap b{color:var(--text)}
  @media(max-width:760px){.panel{bottom:5rem}.cap{display:none}}
  .toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(.92);background:rgba(8,11,18,.96);
    border:1px solid var(--neon);border-radius:14px;padding:.8rem 1.35rem;font-size:.9rem;font-weight:600;
    opacity:0;transition:.28s;pointer-events:none;z-index:30;text-align:center;max-width:86vw}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<div id="app"></div>
<div class="loader" id="loader">Обустраиваю студию…</div>

<div class="hud">
  <div class="brand"><span>🎬</span><div><b>uniqpost · студия</b><br><small>вариант 2 · 3D</small></div></div>
  <div class="stats">
    <div class="stat">На столе <b id="onDesk">0</b></div>
    <div class="stat">Опубликовано <b id="pub">0</b></div>
    <div class="stat">Монитор <b id="active">—</b></div>
  </div>
</div>

<div class="panel">
  <h3>Публикация</h3>
  <div id="nets"></div>
  <button class="btn" id="addBtn">＋ Положить видео на стол</button>
  <button class="btn" id="pubBtn" style="background:transparent;border:1px solid var(--line);color:var(--text)">➤ Опубликовать</button>
</div>

<div class="cap"><b>Смысл:</b> рабочая студия — видео на столе, мониторы показывают кадры. Клик по видео → на монитор → улетает в соцсети.</div>
<div class="toast" id="toast"></div>

<script type="importmap">
{ "imports": { "three": "./libs/three.module.js",
  "three/addons/": "./libs/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

function makeFrameTex(c1,c2,label){
  const cv=document.createElement('canvas'); cv.width=320; cv.height=180;
  const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,320,180); g.addColorStop(0,c1); g.addColorStop(1,c2);
  x.fillStyle=g; x.fillRect(0,0,320,180);
  x.globalAlpha=.20; x.fillStyle='#fff';
  x.beginPath(); x.arc(160,90,44,0,Math.PI*2); x.fill();
  for(let i=0;i<4;i++) x.fillRect(20,120+i*12,120,4);
  x.globalAlpha=1; x.fillStyle='rgba(255,255,255,.9)'; x.font='bold 18px Inter,sans-serif'; x.fillText(label,16,30);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const FRAMES=[
  ['#2f7bff','#0a1a3a'],['#58a6ff','#0c1e40'],['#9b6cff','#1a0f38'],
  ['#3ddcff','#062430'],['#4fd1ff','#082433'],['#7aa8ff','#0d1c38'],
];
const LABELS=['TikTok','Reels','Shorts','VK','Trend','Music','Travel','Food'];
const SOCIALS=[
  {short:'TT',name:'TikTok',color:'#00f2ea'},{short:'YT',name:'YouTube',color:'#ff2d2d'},
  {short:'VK',name:'VK',color:'#0077ff'},{short:'IG',name:'Instagram',color:'#e1306c'},
  {short:'TG',name:'Telegram',color:'#2aabee'},
];

let scene,camera,renderer,controls,clock,raycaster,pointer;
let monitors=[], deskCards=[], socialNodes=[], frameIdx=0, published=0;

init();

function init(){
  clock=new THREE.Clock();
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x05060a);
  scene.fog=new THREE.Fog(0x05060a,14,40);

  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,120);
  camera.position.set(0,5.6,11);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.getElementById('app').appendChild(renderer.domElement);

  controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,1.9,0); controls.enableDamping=true; controls.dampingFactor=.08;
  controls.maxPolarAngle=Math.PI/2.05; controls.minDistance=5; controls.maxDistance=26;
  raycaster=new THREE.Raycaster(); pointer=new THREE.Vector2();

  lights(); buildRoom(); buildDesk(); buildWallMonitors(); buildSocials();
  renderNets();

  addEventListener('resize',onResize);
  renderer.domElement.addEventListener('pointerdown',onDown);
  document.getElementById('addBtn').onclick=()=>addCard(true);
  document.getElementById('pubBtn').onclick=publishAll;
  document.getElementById('loader').style.display='none';
  animate();
}

function m(c,o={}){ return new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.35,...o}); }

function lights(){
  scene.add(new THREE.AmbientLight(0x8fb0ff,.42));
  const key=new THREE.DirectionalLight(0xffffff,1.15); key.position.set(4,12,8); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-14; key.shadow.camera.right=14;
  key.shadow.camera.top=14; key.shadow.camera.bottom=-14; scene.add(key);
  const fill=new THREE.PointLight(0x2f7bff,50,20,2); fill.position.set(-7,5,4); scene.add(fill);
  const rim=new THREE.PointLight(0x9b6cff,35,20,2); rim.position.set(8,4.5,-4); scene.add(rim);
}

function buildRoom(){
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),m(0x0c1119,{roughness:.9,metalness:.1}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  const grid=new THREE.GridHelper(40,40,0x18305a,0x0e1a29); grid.position.y=.01; scene.add(grid);
  const wall=new THREE.MeshStandardMaterial({color:0x0a0f18,roughness:.95,side:THREE.DoubleSide});
  const back=new THREE.Mesh(new THREE.PlaneGeometry(30,9),wall); back.position.set(0,4.5,-8); scene.add(back);
}

function buildDesk(){
  // стол
  const top=new THREE.Mesh(new THREE.BoxGeometry(6.4,.18,2.9),m(0x141d2e,{roughness:.45,metalness:.45}));
  top.position.set(0,1.35,0); top.castShadow=true; top.receiveShadow=true; scene.add(top);
  const edge=new THREE.Mesh(new THREE.BoxGeometry(6.5,.04,.06),new THREE.MeshBasicMaterial({color:0x2f7bff}));
  edge.position.set(0,1.27,1.48); scene.add(edge);
  const edge2=edge.clone(); edge2.position.z=-1.48; scene.add(edge2);
  // ножки
  for(const x of [-3,-1,1,3]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.16,1.35,.16),m(0x1b2740));
    leg.position.set(x,.67,1.2); scene.add(leg);
    const l2=leg.clone(); l2.position.z=-1.2; scene.add(l2);
  }
  // рабочее место: клавиатура + мышь
  const kb=new THREE.Mesh(new THREE.BoxGeometry(1.5,.06,.5),m(0x0f1726));
  kb.position.set(0,1.48,.7); kb.castShadow=true; scene.add(kb);
  const ms=new THREE.Mesh(new THREE.SphereGeometry(.12,16,16),m(0x1a2740,{metalness:.6}));
  ms.position.set(1.1,1.5,.75); ms.scale.set(1,.5,.7); scene.add(ms);
  // лампа-неон на столе
  const lampBase=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.12,24),m(0x18233a));
  lampBase.position.set(-2.7,1.5,-.6); scene.add(lampBase);
  const lampArm=new THREE.Mesh(new THREE.BoxGeometry(.08,1.4,.08),m(0x223052));
  lampArm.position.set(-2.7,2.2,-.6); scene.add(lampArm);
  const lampHead=new THREE.Mesh(new THREE.BoxGeometry(.9,.12,.5),new THREE.MeshStandardMaterial({color:0x2f7bff,emissive:0x2f7bff,emissiveIntensity:.8}));
  lampHead.position.set(-2.4,2.9,-.3); lampHead.rotation.z=-.4; scene.add(lampHead);
  const lampLight=new THREE.PointLight(0x2f7bff,40,12,2); lampLight.position.set(-2.2,2.7,0); scene.add(lampLight);
}

function buildWallMonitors(){
  // 3 монитора на стене — «рабочие экраны студии»
  const xs=[-2.5,0,2.5];
  xs.forEach((x,i)=>{
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(2.15,1.25),
      new THREE.MeshBasicMaterial({map:makeFrameTex(...FRAMES[i%FRAMES.length], 'Проект '+(i+1))}));
    scr.position.set(x,3.1,-7.9); scene.add(scr);
    // рамка
    const fr=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.4,.08),m(0x0d1626));
    fr.position.set(x,3.1,-7.95); scene.add(fr);
    const glow=new THREE.PointLight(0x2f7bff,14,7,2); glow.position.set(x,3.1,-7); scene.add(glow);
    monitors.push({mesh:scr,x,glow,base:makeFrameTex(...FRAMES[i%FRAMES.length],'Проект '+(i+1))});
  });
}

function buildSocials(){
  SOCIALS.forEach((s,i)=>{
    const ang=(i/(SOCIALS.length-1)-.5)*Math.PI*1.5;
    const r=11;
    const pos=new THREE.Vector3(Math.cos(ang)*r, 3.6+Math.sin(i*1.5)*2.2, -3+Math.sin(ang)*r*.6);
    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(s.color),emissive:new THREE.Color(s.color),emissiveIntensity:.45,roughness:.3,metalness:.5});
    const node=new THREE.Mesh(new THREE.IcosahedronGeometry(.52,1),mat);
    node.position.copy(pos); scene.add(node);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.022,8,40),
      new THREE.MeshBasicMaterial({color:s.color,transparent:true,opacity:.4}));
    ring.position.copy(pos); scene.add(ring);
    socialNodes.push({...s,node,ring,pos,phase:i,hits:0});
  });
}

// «кассета» видео на столе — вертикальная карточка с кадром
function makeCard(tex){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.78,.07),m(0x101a2c,{roughness:.4,metalness:.5}));
  body.castShadow=true; g.add(body);
  const face=new THREE.Mesh(new THREE.PlaneGeometry(.9,1.62),new THREE.MeshBasicMaterial({map:tex}));
  face.position.z=.04; g.add(face);
  const rim=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.0,1.78,.07)),
    new THREE.LineBasicMaterial({color:0x9dc4ff,transparent:true,opacity:.5})); g.add(rim);
  return g;
}

function addCard(notify){
  const f=FRAMES[frameIdx%FRAMES.length];
  const tex=makeFrameTex(f[0],f[1],LABELS[frameIdx%LABELS.length]);
  frameIdx++;
  const c=makeCard(tex);
  const i=deskCards.length;
  c.position.set(-1.6+i*1.15, 2.28, .15);
  c.rotation.x=-Math.PI/2*0.86;   // лежат на столе
  c.rotation.z=.05*(i%2?1:-1);
  c.userData={type:'card',cycle:frameIdx};
  scene.add(c); deskCards.push(c);
  if(notify) toast('＋ Видео на столе');
  updateHud();
}

function cardTex(card){
  const f=FRAMES[card.userData.cycle%FRAMES.length];
  return makeFrameTex(f[0],f[1],LABELS[card.userData.cycle%LABELS.length]);
}

// клик по видео → отправляем на монитор → затем в соцсеть
function sendToMonitor(card){
  const mi=Math.floor(Math.random()*monitors.length);
  const mon=monitors[mi];
  const start=card.position.clone();
  const target=new THREE.Vector3(mon.x,3.1,-7.5);
  const t0=clock.getElapsedTime();
  const anim=()=>{
    const k=Math.min(1,(clock.getElapsedTime()-t0)/.9);
    const e=k*k*(3-2*k);
    card.position.lerpVectors(start,target,e);
    card.rotation.x=-Math.PI/2*0.86*(1-e);
    card.rotation.y=e*Math.PI*1.5;
    if(k<1) requestAnimationFrame(anim);
    else{
      scene.remove(card);
      const idx=deskCards.indexOf(card); if(idx>-1) deskCards.splice(idx,1);
      // на мониторе вспыхивает новое «превью»
      mon.mesh.material.map=cardTex(card);
      mon.mesh.material.needsUpdate=true;
      mon.glow.intensity=34;
      setTimeout(()=>{ mon.glow.intensity=14; },320);
      document.getElementById('active').textContent='Экран '+(mi+1);
      toast('🖥 Видео на мониторе: Экран '+(mi+1));
      flyToSocial(new THREE.Vector3(mon.x,3.1,-7.5));
      updateHud();
    }
  };
  anim();
}

function flyToSocial(from){
  const s=socialNodes[Math.floor(Math.random()*socialNodes.length)];
  const v=makeCard(makeFrameTex(...FRAMES[Math.floor(Math.random()*FRAMES.length)],'out'));
  v.scale.setScalar(.6);
  v.position.copy(from); scene.add(v);
  const start=from.clone(), target=s.pos.clone();
  const t0=clock.getElapsedTime();
  const anim=()=>{
    const k=Math.min(1,(clock.getElapsedTime()-t0)/1.15);
    const e=k*k*(3-2*k);
    v.position.lerpVectors(start,target,e);
    v.rotation.y=e*Math.PI*3;
    v.scale.setScalar(.6*(1-e*.5));
    if(k<1) requestAnimationFrame(anim);
    else{ scene.remove(v); pulse(s); published++; updateHud(); }
  };
  anim();
}

function publishAll(){
  if(!deskCards.length){ toast('Стол пуст'); return; }
  [...deskCards].slice(0,3).forEach(sendToMonitor);
}

function pulse(s){
  s.hits++;
  s.node.material.emissiveIntensity=1.9;
  const wave=new THREE.Mesh(new THREE.RingGeometry(.6,.72,48),
    new THREE.MeshBasicMaterial({color:s.color,transparent:true,opacity:.7,side:THREE.DoubleSide}));
  wave.position.copy(s.pos); wave.lookAt(camera.position); scene.add(wave);
  const t0=clock.getElapsedTime();
  const anim=()=>{
    const k=Math.min(1,(clock.getElapsedTime()-t0)/.7);
    wave.scale.setScalar(1+k*3);
    wave.material.opacity=.7*(1-k);
    if(k<1) requestAnimationFrame(anim); else scene.remove(wave);
  };
  anim();
  setTimeout(()=>{ s.node.material.emissiveIntensity=.45; },280);
  renderNets();
}

function renderNets(){
  document.getElementById('nets').innerHTML=SOCIALS.map(s=>`<div class="net">
    <span class="ic" style="background:${s.color}">${s.short}</span><span>${s.name}</span>
    <span class="st">${s.hits?('отправлено '+s.hits):'ожидание'}</span></div>`).join('');
}

function setPtr(e){ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=-(e.clientY/innerHeight)*2+1; }
function onDown(e){
  if(e.button!==0) return;
  setPtr(e);
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(deskCards,true);
  if(!hits.length) return;
  let o=hits[0].object; while(o.parent && !deskCards.includes(o)) o=o.parent;
  if(deskCards.includes(o)) sendToMonitor(o);
}

function updateHud(){
  document.getElementById('onDesk').textContent=deskCards.length;
  document.getElementById('pub').textContent=published;
}

let timer;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(timer); timer=setTimeout(()=>t.classList.remove('show'),1400); }
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  deskCards.forEach((c,i)=>{ c.position.y=2.28+Math.sin(t*1.3+i)*.04; });
  socialNodes.forEach(s=>{ s.node.rotation.y=t*.5+s.phase; s.ring.rotation.x=t*.35+s.phase; });
  monitors.forEach((mo,i)=>{ mo.glow.intensity=13+Math.sin(t*2+i)*3; });
  controls.update();
  renderer.render(scene,camera);
}
</script>
</body>
</html>
